<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Time Survivor: 2D platformer in C++ and SFML">
<style>
.bg{fill:#0B1020}.edge{stroke:#1F2B4D}.ink{fill:#F1F5F9}.muted{fill:#94A3B8}.dim{fill:#64748B}
.accent{fill:#5EEAD4}.violet{fill:#A78BFA}.amber{fill:#FBBF24}.green{fill:#4ADE80}
.chip{fill:#131C38;stroke:#24335C}.chiptext{fill:#CBD5E1}.faint{fill:#1A2444}.fstroke{stroke:#1F2B4D;fill:none}
.win{fill:#111832;stroke:#24335C}.blk{fill:#1E2A4A}.blk2{fill:#2A3A66}
.sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace}
.pulse{animation:p 1.8s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
@media (prefers-color-scheme: light){
.bg{fill:#FFFFFF}.edge{stroke:#DCE3EE}.ink{fill:#0F172A}.muted{fill:#475569}.dim{fill:#64748B}
.accent{fill:#0D9488}.violet{fill:#7C3AED}.amber{fill:#D97706}.green{fill:#16A34A}
.chip{fill:#F1F5F9;stroke:#DCE3EE}.chiptext{fill:#334155}.faint{fill:#EEF2F7}.fstroke{stroke:#E2E8F0}
.win{fill:#F8FAFC;stroke:#DCE3EE}.blk{fill:#E2E8F0}.blk2{fill:#CBD5E1}
}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="1198" height="328" rx="22"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="328" rx="22" class="bg edge" stroke-width="1.5"/>
<g clip-path="url(#c)"><g transform="translate(760 0)">
<rect x="0" y="236" width="440" height="80" class="faint"/>
<rect x="40" y="196" width="110" height="16" rx="3" class="blk2"/>
<rect x="210" y="150" width="90" height="16" rx="3" class="blk2"/>
<rect x="340" y="110" width="80" height="16" rx="3" class="blk2"/>
<g><rect width="22" height="30" rx="4" fill="#FBBF24"/><rect x="13" y="7" width="5" height="5" fill="#0B1020"/>
<animateTransform attributeName="transform" type="translate" dur="3.2s" repeatCount="indefinite"
 values="30 206; 95 166; 120 166; 230 120; 255 120; 350 80; 375 80; 30 206"
 keyTimes="0;.18;.28;.48;.58;.78;.9;1"/></g>
<g class="mono dim" font-size="13"><text x="20" y="40">TIME 00:42</text></g>
</g><rect x="1" y="1" width="5" height="330" fill="url(#g)"/></g>
<text x="40" y="58" class="mono amber" font-size="15" font-weight="700">04</text>
<text x="72" y="58" class="mono dim" font-size="15">/ project</text>
<rect x="1114" y="38" width="54" height="28" rx="14" class="chip"/><text x="1126" y="57" class="mono amber" font-size="12.5" font-weight="700" letter-spacing="1">GAME</text>
<text x="38" y="110" class="sans ink" font-size="36" font-weight="800" letter-spacing="-0.8">Time Survivor</text>
<text x="40" y="146" class="sans muted" font-size="16.5">A 2D platformer built from scratch in C++ and SFML: a state-machine</text>
<text x="40" y="171" class="sans muted" font-size="16.5">player controller, AABB physics, a following camera, and timed levels.</text>
<rect x="40" y="268" width="44" height="28" rx="8" class="chip"/><text x="51" y="287" class="mono chiptext" font-size="12.5">C++</text><rect x="92" y="268" width="52" height="28" rx="8" class="chip"/><text x="103" y="287" class="mono chiptext" font-size="12.5">SFML</text><rect x="152" y="268" width="44" height="28" rx="8" class="chip"/><text x="163" y="287" class="mono chiptext" font-size="12.5">OOP</text><rect x="204" y="268" width="89" height="28" rx="8" class="chip"/><text x="215" y="287" class="mono chiptext" font-size="12.5">Game Loop</text><rect x="301" y="268" width="74" height="28" rx="8" class="chip"/><text x="312" y="287" class="mono chiptext" font-size="12.5">Physics</text>
