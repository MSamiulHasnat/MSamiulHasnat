<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="M Samiul Hasnat, MS in Computer Science and Technology at Dalian University of Technology">
  <style>
    .bg{fill:#0B1020}.panel{fill:#111832}.dot{fill:#1E2A4A}
    .ink{fill:#F1F5F9}.muted{fill:#94A3B8}.dim{fill:#64748B}
    .accent{fill:#5EEAD4}.violet{fill:#A78BFA}.amber{fill:#FBBF24}
    .ring{fill:none;stroke:#1F2B4D;stroke-width:1.5}
    .edge{stroke:#2A3A66;stroke-width:1.4}
    .chip{fill:#131C38;stroke:#24335C;stroke-width:1}
    .chiptext{fill:#CBD5E1}
    .sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace}
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-color-scheme: light){
      .bg{fill:#F8FAFC}.panel{fill:#EEF2F8}.dot{fill:#DCE3EE}
      .ink{fill:#0F172A}.muted{fill:#475569}.dim{fill:#64748B}
      .accent{fill:#0D9488}.violet{fill:#7C3AED}.amber{fill:#D97706}
      .ring{stroke:#CBD5E1}.edge{stroke:#C3CEDF}
      .chip{fill:#FFFFFF;stroke:#D5DDE9}.chiptext{fill:#334155}
    }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" class="dot"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" class="bg"/>
    <rect x="700" width="500" height="420" fill="url(#dots)"/>
    <rect y="414" width="1200" height="6" fill="url(#bar)"/>
  </g>

  <!-- Left: identity -->
  <g class="rise d1">
    <text x="72" y="104" class="mono accent" font-size="18">~/samiul $ whoami<tspan class="caret ink"> ▍</tspan></text>
  </g>
  <g class="rise d2">
    <text x="70" y="184" class="sans ink" font-size="66" font-weight="800" letter-spacing="-1.5">M Samiul Hasnat</text>
  </g>
  <g class="rise d3">
    <text x="72" y="232" class="sans ink" font-size="23" font-weight="600">MS in Computer Science &amp; Technology</text>
    <text x="72" y="264" class="sans muted" font-size="19">Dalian University of Technology  ·  B.Eng. Sichuan University</text>
  </g>
  <g class="rise d4 sans" font-size="15" font-weight="600">
    <rect x="72" y="300" width="138" height="36" rx="18" class="chip"/>
    <circle cx="92" cy="318" r="4" class="accent"/>
    <text x="104" y="323" class="chiptext">Deep Learning</text>

    <rect x="222" y="300" width="160" height="36" rx="18" class="chip"/>
    <circle cx="242" cy="318" r="4" class="violet"/>
    <text x="254" y="323" class="chiptext">Medical Imaging</text>

    <rect x="394" y="300" width="120" height="36" rx="18" class="chip"/>
    <circle cx="414" cy="318" r="4" class="amber"/>
    <text x="426" y="323" class="chiptext">LLM Agents</text>

    <rect x="526" y="300" width="146" height="36" rx="18" class="chip"/>
    <circle cx="546" cy="318" r="4" class="accent"/>
    <text x="558" y="323" class="chiptext">Full-stack Web</text>
  </g>

  <!-- Right: a CT slice being scanned, wired into a knowledge graph -->
  <g transform="translate(950 205)">
    <circle r="150" class="ring"/>
    <circle r="112" class="ring"/>
    <circle r="74" class="ring"/>
    <circle r="36" class="ring"/>

    <g>
      <path d="M0 0 L150 0 A150 150 0 0 0 106 -106 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="150" y2="0" stroke="#5EEAD4" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>

    <g class="edge">
      <line x1="0" y1="0" x2="-79" y2="-79"/>
      <line x1="0" y1="0" x2="98" y2="54"/>
      <line x1="0" y1="0" x2="-30" y2="108"/>
      <line x1="-79" y1="-79" x2="40" y2="-142"/>
      <line x1="-79" y1="-79" x2="-146" y2="30"/>
      <line x1="98" y1="54" x2="40" y2="-142"/>
      <line x1="98" y1="54" x2="-30" y2="108"/>
      <line x1="-146" y1="30" x2="-30" y2="108"/>
      <line x1="40" y1="-142" x2="138" y2="-58"/>
      <line x1="138" y1="-58" x2="98" y2="54"/>
    </g>

    <circle r="9" class="ink"/>
    <circle r="7" cx="-79" cy="-79" class="accent"><animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="7" cx="98" cy="54" class="violet"><animate attributeName="r" values="7;10;7" dur="2.4s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle r="6" cx="-30" cy="108" class="amber"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="5" cx="40" cy="-142" class="accent"/>
    <circle r="5" cx="-146" cy="30" class="violet"/>
    <circle r="5" cx="138" cy="-58" class="amber"/>
  </g>
</svg>
